<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>牛さんドライブ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'M PLUS Rounded 1c',sans-serif;user-select:none;touch-action:none;}

/* ══ ログイン（縦） ══ */
#login-screen{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#1a1a2e,#2d1b4e 50%,#1a3a2e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:500;padding:20px;
}
.logo-icon{font-size:60px;text-align:center;margin-bottom:6px;}
.logo-title{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;color:#FFD600;text-align:center;text-shadow:2px 2px 0 rgba(0,0,0,0.4);letter-spacing:2px;margin-bottom:2px;}
.logo-sub{font-size:11px;color:rgba(255,255,255,0.55);text-align:center;margin-bottom:18px;}
.login-card{background:rgba(255,255,255,0.96);border-radius:20px;border:3px solid #FFD600;padding:18px 18px 14px;width:100%;max-width:310px;box-shadow:0 8px 32px rgba(0,0,0,0.45);}
.login-rules{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px;}
.rule-chip{border-radius:10px;padding:6px 6px;font-size:10px;font-weight:700;text-align:center;line-height:1.5;border:1.5px solid #FFE082;background:#FFF8E1;}
.rule-chip.meat{border-color:#E74C3C;background:#FFF0EE;color:#C0392B;}
.rule-chip.veg{border-color:#4CAF50;background:#F1F8E9;color:#2E7D32;}
.rule-chip.bad{border-color:#FF9800;background:#FFF3E0;color:#E65100;grid-column:1/-1;}
.lbl{font-size:10px;font-weight:700;color:#795548;margin-bottom:3px;display:block;}
.ov-input{width:100%;border:2px solid #FFD600;border-radius:10px;padding:8px 11px;font-size:14px;font-family:'M PLUS Rounded 1c',sans-serif;margin-bottom:7px;outline:none;background:#FFFDE7;}
.ov-input:focus{border-color:#F9A825;}
.ov-err{color:#C0392B;font-size:11px;text-align:center;min-height:16px;margin-bottom:5px;}
.ov-btn{background:#F9A825;border:none;border-radius:11px;padding:11px 0;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 0 #E65100;width:100%;margin-bottom:6px;}
.ov-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E65100;}
.ov-btn.sec{background:#78909C;box-shadow:0 4px 0 #455A64;font-size:13px;padding:9px 0;}

/* ══ ゲーム画面 ══ */
#app{position:fixed;inset:0;overflow:hidden;display:none;}
#game-wrap{position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;}

/* 空（上20%） */
#sky{position:absolute;inset:0;background:linear-gradient(180deg,#3A9FD8 0%,#7DCEF5 45%,#A8EE80 100%);}
.cloud{position:absolute;background:rgba(255,255,255,0.9);border-radius:50px;animation:cloudMove linear infinite;}
@keyframes cloudMove{from{left:108%;}to{left:-250px;}}
#mountains{position:absolute;left:0;right:0;overflow:hidden;}
.mtn{position:absolute;bottom:0;width:0;height:0;border-left:solid transparent;border-right:solid transparent;border-bottom:solid;}
.tree{position:absolute;font-size:28px;animation:treeMove linear infinite;z-index:3;}
@keyframes treeMove{from{left:108%;}to{left:-60px;}}

/* 道路エリア（下80%） */
#road-area{position:absolute;left:0;right:0;bottom:0;}
/* 上の草ライン */
#grass-top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(180deg,#66BB6A,#43A047);z-index:2;}
/* 下の草ライン */
#grass-bottom{position:absolute;bottom:0;left:0;right:0;height:12px;background:linear-gradient(0deg,#66BB6A,#43A047);z-index:2;}
/* 縁石上 */
#curb-top{position:absolute;top:12px;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#eee 0,#eee 22px,#E53935 22px,#E53935 44px);z-index:3;}
/* 縁石下 */
#curb-bottom{position:absolute;bottom:12px;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#eee 0,#eee 22px,#E53935 22px,#E53935 44px);z-index:3;}
/* 路面 */
#road-surface{position:absolute;top:20px;bottom:20px;left:0;right:0;background:linear-gradient(180deg,#546E7A,#455A64);}
/* レーン区切り */
#lane-lines{position:absolute;top:20px;bottom:20px;left:0;right:0;z-index:4;}
.lane-div{position:absolute;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#FFD600 0,#FFD600 48px,transparent 48px,transparent 100px);animation:laneAnim .5s linear infinite;opacity:0.6;}
@keyframes laneAnim{from{background-position:0 0;}to{background-position:-148px 0;}}

/* 現在レーンのハイライト */
#lane-highlight{
  position:absolute;left:0;right:0;
  background:rgba(255,214,0,0.12);
  border-top:2px solid rgba(255,214,0,0.5);
  border-bottom:2px solid rgba(255,214,0,0.5);
  z-index:5;pointer-events:none;
  transition:top .1s cubic-bezier(.4,0,.2,1),height .1s;
}

/* 左端のレーン番号 */
.lane-num{
  position:absolute;left:4px;
  width:24px;height:24px;
  background:rgba(0,0,0,0.4);border:1.5px solid rgba(255,255,255,0.25);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:rgba(255,255,255,0.7);
  z-index:6;transform:translateY(-50%);
}
.lane-num.active{background:rgba(255,214,0,0.7);color:#000;border-color:#FFD600;}

/* HUD */
#hud{position:absolute;top:5px;left:10px;display:flex;align-items:center;gap:8px;z-index:80;pointer-events:none;}
#logo{font-family:'Nunito',sans-serif;font-size:12px;font-weight:900;color:#fff;background:rgba(0,0,0,0.32);border-radius:12px;padding:3px 10px;}
#score-box{background:rgba(0,0,0,0.32);border-radius:12px;padding:2px 12px;text-align:center;}
#score-label{font-size:7px;color:rgba(255,255,255,0.7);font-weight:700;letter-spacing:1px;}
#score-v{font-size:20px;font-weight:900;color:#FFD600;line-height:1.15;}
#lives{display:flex;gap:2px;align-items:center;}
.life{font-size:16px;transition:opacity .2s,transform .2s;}
.life.lost{opacity:.15;filter:grayscale(1);transform:scale(0.8);}
#player-tag{background:rgba(0,0,0,0.32);border-radius:12px;padding:3px 9px;font-size:10px;font-weight:700;color:#FFD600;}

/* コンボ */
#combo-display{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:900;color:#FFD600;text-shadow:2px 2px 0 rgba(0,0,0,0.5);z-index:80;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;}
#combo-display.show{opacity:1;}

/* 牛キャラ */
#car{position:absolute;left:48px;z-index:30;transition:top .1s cubic-bezier(.4,0,.2,1);filter:drop-shadow(3px 5px 6px rgba(0,0,0,0.45));}

/* アイテム */
.item{position:absolute;line-height:1;z-index:25;pointer-events:none;}

/* ボタン */
.ctrl-btn{position:absolute;width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,0.75);background:rgba(255,255,255,0.2);backdrop-filter:blur(6px);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.3);transition:transform .08s,background .08s;z-index:80;}
.ctrl-btn:active,.ctrl-btn.pressing{transform:scale(0.87);background:rgba(255,255,255,0.5);}
#btn-up{bottom:16px;left:16px;}
#btn-down{bottom:16px;right:16px;}

/* 右上ボタン群 */
#top-right{position:absolute;top:5px;right:10px;display:flex;gap:6px;z-index:80;}
.top-btn{background:rgba(0,0,0,0.32);border:1.5px solid rgba(255,215,0,0.45);border-radius:12px;padding:5px 11px;color:#FFD600;font-size:11px;font-weight:900;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;white-space:nowrap;}
.top-btn.white{border-color:rgba(255,255,255,0.3);color:#fff;}

/* フラッシュ */
#flash{position:absolute;inset:0;background:rgba(255,40,40,0.38);pointer-events:none;opacity:0;z-index:90;transition:opacity .07s;}
#flash.show{opacity:1;}

/* ポップ */
.pop{position:absolute;font-weight:900;font-size:19px;pointer-events:none;z-index:99;animation:popUp .75s ease-out forwards;text-shadow:1px 1px 0 rgba(0,0,0,0.4);white-space:nowrap;}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1);}45%{transform:translateY(-24px) scale(1.2);}100%{opacity:0;transform:translateY(-56px) scale(0.8);}}

/* オーバーレイ */
.g-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:200;}
.g-box{background:linear-gradient(160deg,#FFFDE7,#FFF8E1);border:4px solid #F9A825;border-radius:20px;padding:18px 22px;width:min(480px,90%);box-shadow:0 10px 40px rgba(0,0,0,0.5);}
.g-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;color:#E65100;margin-bottom:8px;text-align:center;}
.g-btn{background:#F9A825;border:none;border-radius:11px;padding:11px 0;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 0 #E65100;width:100%;margin-top:7px;}
.g-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E65100;}
.g-btn.sec{background:#78909C;box-shadow:0 4px 0 #455A64;}
.g-row{display:flex;gap:14px;align-items:flex-start;}
.g-left{flex:1;}.g-right{flex:1;font-size:11px;color:#795548;line-height:2;}
.g-score{font-size:42px;font-weight:900;color:#333;text-align:center;margin:4px 0;}
.g-hi{font-size:11px;color:#A0826D;text-align:center;margin-bottom:6px;}
.rank-table{width:100%;border-collapse:collapse;margin-top:6px;}
.rank-table th{background:#F9A825;color:#fff;padding:5px 8px;font-size:11px;text-align:left;}
.rank-table td{padding:5px 8px;font-size:12px;border-bottom:1px solid #FFE082;}
.rank-table tr:nth-child(even) td{background:#FFFDE7;}
.rank-gold td{background:#FFF9C4!important;font-weight:900;}
.rank-silver td{background:#F5F5F5!important;}
.rank-bronze td{background:#FBE9E7!important;}
</style>
</head>
<body>

<!-- ログイン（縦） -->
<div id="login-screen">
  <div class="logo-icon">🐄🚗</div>
  <div class="logo-title">牛さんドライブ</div>
  <div class="logo-sub">スーパーの肉屋さんゲーム</div>
  <div class="login-card">
    <div class="login-rules">
      <div class="rule-chip meat">🥩🍗🌭<br>お肉→高得点！</div>
      <div class="rule-chip veg">🥦🥕🐟<br>野菜・魚→低得点</div>
      <div class="rule-chip bad">🚧🪨🚜⚠️🐕　障害物→減点＆ライフ減！</div>
    </div>
    <span class="lbl">ニックネーム</span>
    <input class="ov-input" id="input-nick" type="text" placeholder="例：たろう" maxlength="12" autocomplete="off">
    <span class="lbl">パスワード（4文字以上）</span>
    <input class="ov-input" id="input-pass" type="password" placeholder="パスワード" maxlength="20">
    <div class="ov-err" id="login-err"></div>
    <button class="ov-btn" onclick="doLogin()">ログイン / 新規登録</button>
    <button class="ov-btn sec" onclick="guestPlay()">ゲストでプレイ（記録なし）</button>
  </div>
</div>

<!-- ゲーム（横） -->
<div id="app">
  <div id="game-wrap">
    <div id="sky"></div>
    <div id="mountains"></div>

    <div id="road-area">
      <div id="grass-top"></div>
      <div id="curb-top"></div>
      <div id="road-surface"></div>
      <div id="lane-lines">
        <div id="lane-highlight"></div>
      </div>
      <div id="curb-bottom"></div>
      <div id="grass-bottom"></div>
    </div>

    <div id="hud">
      <div id="logo">🐄 牛さんドライブ</div>
      <div id="score-box"><div id="score-label">スコア</div><div id="score-v">0</div></div>
      <div id="lives">
        <span class="life" id="l0">❤️</span>
        <span class="life" id="l1">❤️</span>
        <span class="life" id="l2">❤️</span>
      </div>
      <div id="player-tag">👤 ゲスト</div>
    </div>

    <div id="top-right">
      <button class="top-btn" onclick="showRanking()">🏆 ランキング</button>
      <button class="top-btn white" id="bgm-btn" onclick="toggleBGM()">🎵 ON</button>
    </div>

    <div id="combo-display"></div>
    <img id="car" src="cow.png" alt="🐄">
    <div id="flash"></div>

    <button class="ctrl-btn" id="btn-up">⬆️</button>
    <button class="ctrl-btn" id="btn-down">⬇️</button>

    <!-- ゲームオーバー -->
    <div class="g-overlay" id="gameover-overlay" style="display:none;">
      <div class="g-box">
        <div class="g-row">
          <div class="g-left">
            <div style="text-align:center;font-size:40px;">🐄💨</div>
            <div class="g-title" id="go-title">ゲームオーバー！</div>
            <div class="g-score" id="go-score">0</div>
            <div class="g-hi" id="go-hi"></div>
            <button class="g-btn" onclick="restartGame()">もう一度！</button>
            <button class="g-btn sec" onclick="showRanking()">🏆 ランキング</button>
          </div>
          <div class="g-right">
            🥩🍗🌭<br><b style="color:#C0392B">お肉 → 高得点！</b><br>
            🥦🥕🌽🐟🦑🦐<br><b style="color:#2E7D4F">野菜・魚介 → 低得点</b><br>
            🚧🪨🚜🐕⚠️<br><b style="color:#E65100">障害物 → 減点＆ライフ減</b>
          </div>
        </div>
      </div>
    </div>

    <!-- ランキング -->
    <div class="g-overlay" id="ranking-overlay" style="display:none;">
      <div class="g-box">
        <div class="g-title">🏆 ランキング TOP10</div>
        <div id="ranking-content" style="max-height:50vh;overflow-y:auto;"></div>
        <button class="g-btn" onclick="closeRanking()">とじる</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══ Supabase ══
const SB_URL='https://hyfltnwwtpmtcyxumuxo.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5Zmx0bnd3dHBtdGN5eHVtdXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODU3NDgsImV4cCI6MjA5MjI2MTc0OH0.2xzJpsgWeykT366Rf2r7hYVF4_XiNyFEeOC7UYTwii8';
const TABLE='cow_drive_rankings';

async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+'/rest/v1/'+path,{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
    ...opts
  });
  if(!res.ok)throw new Error(await res.text());
  const t=await res.text();return t?JSON.parse(t):null;
}

let currentNick='ゲスト',currentPass='',isGuest=true;
let hiScore=parseInt(localStorage.getItem('cowdrive_hi')||'0');

async function doLogin(){
  const nick=document.getElementById('input-nick').value.trim();
  const pass=document.getElementById('input-pass').value.trim();
  const err=document.getElementById('login-err');
  if(!nick){err.textContent='ニックネームを入力してください';return;}
  if(pass.length<4){err.textContent='パスワードは4文字以上です';return;}
  err.textContent='確認中…';
  try{
    const ex=await sbFetch(`${TABLE}?nickname=eq.${encodeURIComponent(nick)}&select=nickname,password&limit=1`);
    if(ex&&ex.length>0&&ex[0].password!==pass){err.textContent='パスワードが違います';return;}
    currentNick=nick;currentPass=pass;isGuest=false;
    launchGame();
  }catch(e){err.textContent='エラーが発生しました';console.error(e);}
}
function guestPlay(){currentNick='ゲスト';isGuest=true;launchGame();}

// ══ ゲーム起動（横向き） ══
const ROWS=4;
let GW=0,GH=0; // ゲーム内座標（常に横向きサイズ）

function launchGame(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('player-tag').textContent='👤 '+currentNick;
  applyLayout();
  startGame();
  initBGM();
}

function applyLayout(){
  const wrap=document.getElementById('game-wrap');
  const sw=window.innerWidth, sh=window.innerHeight;
  const isPortrait=sh>sw;

  if(isPortrait){
    // 縦画面 → 90度回転して横向きに
    GW=sh; GH=sw;
    wrap.style.width=GW+'px';
    wrap.style.height=GH+'px';
    wrap.style.transform=`rotate(90deg) translateY(-${GH}px)`;
  }else{
    GW=sw; GH=sh;
    wrap.style.width=GW+'px';
    wrap.style.height=GH+'px';
    wrap.style.transform='none';
  }

  layoutRoad();
  buildBg();
  setCarPos();
  updateLaneHighlight();
  updateLaneNums();
  repositionItems();
}

window.addEventListener('resize',()=>{if(gameRunning)applyLayout();});
window.addEventListener('orientationchange',()=>setTimeout(applyLayout,350));

// ══ 道路レイアウト（下80%） ══
const ROAD_RATIO=0.80; // 画面の80%
function getRoadTop(){return GH*(1-ROAD_RATIO);}
function getLaneH(){return (GH*ROAD_RATIO - 40)/ROWS;} // 縁石・草を除く

function getRowY(row){
  const roadTop=getRoadTop();
  const laneH=getLaneH();
  // 20px=草+縁石上
  return roadTop + 20 + laneH*row + laneH/2;
}

function layoutRoad(){
  const roadTop=getRoadTop();
  const ra=document.getElementById('road-area');
  ra.style.top=roadTop+'px';
  ra.style.height=(GH-roadTop)+'px';
  // 路面
  const rs=document.getElementById('road-surface');
  rs.style.top='20px';
  rs.style.bottom='20px';
  // レーン区切り
  buildLaneLines();
}

function buildLaneLines(){
  const ll=document.getElementById('lane-lines');
  // 既存の区切り線とレーン番号を削除（ハイライトは残す）
  Array.from(ll.querySelectorAll('.lane-div,.lane-num')).forEach(e=>e.remove());
  const laneH=getLaneH();
  for(let i=1;i<ROWS;i++){
    const d=document.createElement('div');d.className='lane-div';
    d.style.top=(20+laneH*i)+'px';ll.appendChild(d);
  }
  for(let i=0;i<ROWS;i++){
    const n=document.createElement('div');n.className='lane-num';n.id='lnum'+i;
    n.textContent=i+1;
    n.style.top=(20+laneH*i+laneH/2)+'px';
    ll.appendChild(n);
  }
}

function updateLaneHighlight(){
  const hl=document.getElementById('lane-highlight');
  const laneH=getLaneH();
  hl.style.top=(20+laneH*carRow)+'px';
  hl.style.height=laneH+'px';
}

function updateLaneNums(){
  for(let i=0;i<ROWS;i++){
    const el=document.getElementById('lnum'+i);
    if(el) el.classList.toggle('active',i===carRow);
  }
}

// ══ 牛のサイズをレーンに合わせる ══
function setCarPos(){
  const laneH=getLaneH();
  const carSize=Math.round(laneH*0.88);
  carEl.style.width=carSize+'px';
  carEl.style.height=carSize+'px';
  carEl.style.top=(getRowY(carRow)-carSize/2)+'px';
  updateLaneHighlight();
  updateLaneNums();
}

// ══ 背景 ══
function buildBg(){
  const roadTop=getRoadTop();
  // 山
  const mtn=document.getElementById('mountains');
  mtn.innerHTML='';
  mtn.style.bottom=(GH-roadTop+10)+'px';
  mtn.style.height='120px';
  [{l:'3%',w:180,h:88,c:'#7AAD7A'},{l:'20%',w:220,h:108,c:'#68A068'},{l:'43%',w:160,h:78,c:'#8FBC8F'},{l:'63%',w:200,h:98,c:'#78B278'},{l:'82%',w:150,h:73,c:'#96C896'}].forEach(p=>{
    const d=document.createElement('div');d.className='mtn';
    d.style.cssText=`left:${p.l};border-left-width:${p.w/2}px;border-right-width:${p.w/2}px;border-bottom-width:${p.h}px;border-bottom-color:${p.c}`;
    mtn.appendChild(d);
  });
  // 雲
  document.querySelectorAll('.cloud').forEach(c=>c.remove());
  [{w:110,h:34,top:'4%',dur:22,delay:-5},{w:155,h:42,top:'12%',dur:30,delay:-13},{w:78,h:26,top:'2%',dur:17,delay:-2}].forEach(c=>{
    const el=document.createElement('div');el.className='cloud';
    el.style.cssText=`width:${c.w}px;height:${c.h}px;top:${c.top};animation-duration:${c.dur}s;animation-delay:${c.delay}s`;
    wrapEl.appendChild(el);
  });
  // 木
  document.querySelectorAll('.tree').forEach(t=>t.remove());
  ['🌳','🌲','🌴','🌳','🌲'].forEach(emoji=>{
    const t=document.createElement('div');t.className='tree';t.textContent=emoji;
    t.style.bottom=(GH-roadTop+6)+'px';
    const dur=7+Math.random()*5;
    t.style.animationDuration=dur+'s';
    t.style.animationDelay=(-dur*Math.random())+'s';
    wrapEl.appendChild(t);
  });
}

// ══ BGM ══
let bgmAudio=null,bgmOn=true;
function initBGM(){
  if(bgmAudio)return;
  bgmAudio=new Audio('bgm.mp3');
  bgmAudio.loop=true;bgmAudio.volume=0.6;
  bgmAudio.play().catch(()=>{});
}
function toggleBGM(){
  if(!bgmAudio)return;
  bgmOn=!bgmOn;
  if(bgmOn){bgmAudio.play();document.getElementById('bgm-btn').textContent='🎵 ON';}
  else{bgmAudio.pause();document.getElementById('bgm-btn').textContent='🔇 OFF';}
}

// ══ スコア送信 ══
async function submitScore(nick,pass,score){
  if(isGuest)return;
  try{
    const ex=await sbFetch(`${TABLE}?nickname=eq.${encodeURIComponent(nick)}&select=id,score&limit=1`);
    if(ex&&ex.length>0){
      if(score>ex[0].score) await sbFetch(`${TABLE}?id=eq.${ex[0].id}`,{method:'PATCH',body:JSON.stringify({score,created_at:new Date().toISOString()})});
    }else{
      await sbFetch(TABLE,{method:'POST',body:JSON.stringify({nickname:nick,password:pass,score})});
    }
  }catch(e){console.error(e);}
}

// ══ ランキング ══
async function showRanking(){
  document.getElementById('ranking-overlay').style.display='flex';
  document.getElementById('ranking-content').innerHTML='<div style="text-align:center;padding:14px;">読み込み中…</div>';
  try{
    const data=await sbFetch(`${TABLE}?select=nickname,score&order=score.desc&limit=10`);
    if(!data||!data.length){document.getElementById('ranking-content').innerHTML='<div style="text-align:center;padding:14px;color:#999;">まだ記録がありません</div>';return;}
    const M=['🥇','🥈','🥉'],C=['rank-gold','rank-silver','rank-bronze'];
    let html='<table class="rank-table"><thead><tr><th>順位</th><th>ニックネーム</th><th>スコア</th></tr></thead><tbody>';
    data.forEach((r,i)=>{html+=`<tr class="${i<3?C[i]:''}"><td>${i<3?M[i]:(i+1)+'位'}</td><td>${esc(r.nickname)}</td><td>${r.score.toLocaleString()}</td></tr>`;});
    document.getElementById('ranking-content').innerHTML=html+'</tbody></table>';
  }catch(e){document.getElementById('ranking-content').innerHTML='<div style="text-align:center;padding:14px;color:#E74C3C;">読み込み失敗</div>';}
}
function closeRanking(){document.getElementById('ranking-overlay').style.display='none';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ══ ゲーム ══
const ITEMS=[
  {emoji:'🥩',type:'meat',pts:80},{emoji:'🍗',type:'meat',pts:70},{emoji:'🌭',type:'meat',pts:60},
  {emoji:'🥦',type:'food',pts:15},{emoji:'🥕',type:'food',pts:10},{emoji:'🌽',type:'food',pts:12},
  {emoji:'🐟',type:'food',pts:10},{emoji:'🦑',type:'food',pts:8},{emoji:'🦐',type:'food',pts:8},
  {emoji:'🚧',type:'bad',pts:-30},{emoji:'🪨',type:'bad',pts:-30},{emoji:'🛢️',type:'bad',pts:-25},
  {emoji:'⚠️',type:'bad',pts:-20},{emoji:'🐕',type:'bad',pts:-25},{emoji:'🚜',type:'bad',pts:-40},
];

let score=0,lives=3,combo=0,gameRunning=false;
let carRow=1,items=[],spawnTimer=0,spawnInterval=1100;
let lastTime=null,animFrame=null;
let pressUp=false,pressDown=false,moveTimer=0;
const MOVE_DELAY=130;

const wrapEl=document.getElementById('game-wrap');
const carEl=document.getElementById('car');
const flashEl=document.getElementById('flash');
const comboEl=document.getElementById('combo-display');

function repositionItems(){
  items.forEach(item=>{
    const laneH=getLaneH();
    const sz=Math.round(laneH*0.78);
    item.el.style.fontSize=sz+'px';
    item.el.style.top=(getRowY(item.row)-sz/2)+'px';
  });
}

function startGame(){
  score=0;lives=3;combo=0;carRow=1;
  items.forEach(i=>i.el&&i.el.remove());
  items=[];spawnTimer=0;spawnInterval=1100;lastTime=null;moveTimer=0;gameRunning=true;
  document.getElementById('gameover-overlay').style.display='none';
  updateHUD();setCarPos();
  cancelAnimationFrame(animFrame);
  animFrame=requestAnimationFrame(loop);
}
function restartGame(){document.getElementById('gameover-overlay').style.display='none';startGame();}

function loop(ts){
  if(!gameRunning)return;
  if(!lastTime)lastTime=ts;
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  moveTimer+=dt;
  if(moveTimer>=MOVE_DELAY){
    moveTimer=0;
    if(pressUp&&carRow>0){carRow--;setCarPos();}
    else if(pressDown&&carRow<ROWS-1){carRow++;setCarPos();}
  }
  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){spawnTimer=0;spawnItem();spawnInterval=Math.max(480,spawnInterval-8);}

  const carX=48+carEl.clientWidth*0.5;
  items.forEach(item=>{
    item.x-=item.speed*dt/1000;
    item.el.style.left=item.x+'px';
    if(!item.hit){
      const iy=getRowY(item.row),cy=getRowY(carRow);
      const hitW=carEl.clientWidth*0.45;
      if(Math.abs(item.x+item.sz*0.5-carX)<hitW+item.sz*0.4&&Math.abs(iy-cy)<getLaneH()*0.5){
        item.hit=true;handleHit(item);
      }
    }
    if(item.x<-100){item.el.remove();item.done=true;}
  });
  items=items.filter(i=>!i.done);
  animFrame=requestAnimationFrame(loop);
}

function spawnItem(){
  const row=Math.floor(Math.random()*ROWS);
  const r=Math.random();
  let pool;
  if(r<0.25)pool=ITEMS.filter(i=>i.type==='meat');
  else if(r<0.58)pool=ITEMS.filter(i=>i.type==='food');
  else pool=ITEMS.filter(i=>i.type==='bad');
  const def=pool[Math.floor(Math.random()*pool.length)];
  const el=document.createElement('div');el.className='item';el.textContent=def.emoji;
  const laneH=getLaneH();
  const sz=Math.round(laneH*0.78);
  el.style.fontSize=sz+'px';
  const x=GW+10;
  el.style.left=x+'px';
  el.style.top=(getRowY(row)-sz/2)+'px';
  wrapEl.appendChild(el);
  const speed=220+Math.random()*70+((1100-spawnInterval)*0.25);
  items.push({row,x,speed,el,def,sz,hit:false,done:false});
}

function handleHit(item){
  const px=item.x,py=getRowY(item.row)-30;
  if(item.def.type==='meat'){
    combo++;
    const pts=item.def.pts*(combo>=3?combo:1);
    score=Math.max(0,score+pts);updateHUD();
    showPop('+'+pts+(combo>=3?' ×'+combo+'🔥':''),px,py,'#FF6B35');
    if(combo>=3){comboEl.textContent='肉コンボ×'+combo+'🔥';comboEl.classList.add('show');clearTimeout(window._ct);window._ct=setTimeout(()=>comboEl.classList.remove('show'),900);}
  }else if(item.def.type==='food'){
    combo=0;comboEl.classList.remove('show');
    score=Math.max(0,score+item.def.pts);updateHUD();showPop('+'+item.def.pts,px,py,'#4CAF50');
  }else{
    combo=0;comboEl.classList.remove('show');
    score=Math.max(0,score+item.def.pts);lives=Math.max(0,lives-1);updateHUD();
    showPop('💥'+item.def.pts,px,py,'#E74C3C');doFlash();
    if(lives<=0){item.el.remove();item.done=true;setTimeout(endGame,300);return;}
  }
  item.el.remove();item.done=true;
}

function doFlash(){flashEl.classList.add('show');setTimeout(()=>flashEl.classList.remove('show'),130);}
function showPop(text,x,y,color){
  const p=document.createElement('div');p.className='pop';p.textContent=text;p.style.color=color;p.style.left=x+'px';p.style.top=y+'px';
  wrapEl.appendChild(p);setTimeout(()=>p.remove(),750);
}
function updateHUD(){
  document.getElementById('score-v').textContent=score;
  for(let i=0;i<3;i++)document.getElementById('l'+i).classList.toggle('lost',i>=lives);
}

async function endGame(){
  gameRunning=false;cancelAnimationFrame(animFrame);
  if(score>hiScore){hiScore=score;localStorage.setItem('cowdrive_hi',hiScore);}
  await submitScore(currentNick,currentPass,score);
  document.getElementById('go-title').textContent=lives<=0?'ゲームオーバー！':'タイムアップ！';
  document.getElementById('go-score').textContent=score.toLocaleString();
  document.getElementById('go-hi').textContent='自己ベスト: '+hiScore.toLocaleString();
  document.getElementById('gameover-overlay').style.display='flex';
}

// ══ ボタン操作 ══
function setupBtn(id,isUp){
  const btn=document.getElementById(id);
  const go=()=>{
    if(isUp){if(gameRunning&&carRow>0){carRow--;setCarPos();}}
    else{if(gameRunning&&carRow<ROWS-1){carRow++;setCarPos();}}
  };
  const dn=e=>{e.preventDefault();btn.classList.add('pressing');if(isUp)pressUp=true;else pressDown=true;go();};
  const up=e=>{e.preventDefault();btn.classList.remove('pressing');if(isUp)pressUp=false;else pressDown=false;};
  btn.addEventListener('touchstart',dn,{passive:false});btn.addEventListener('touchend',up,{passive:false});
  btn.addEventListener('mousedown',dn);btn.addEventListener('mouseup',up);
}
setupBtn('btn-up',true);setupBtn('btn-down',false);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){pressUp=true;if(gameRunning&&carRow>0){carRow--;setCarPos();}}
  if(e.key==='ArrowDown'){pressDown=true;if(gameRunning&&carRow<ROWS-1){carRow++;setCarPos();}}
});
document.addEventListener('keyup',e=>{if(e.key==='ArrowUp')pressUp=false;if(e.key==='ArrowDown')pressDown=false;});

let swY=null;
wrapEl.addEventListener('touchstart',e=>{if(e.target.id==='btn-up'||e.target.id==='btn-down')return;swY=e.touches[0].clientY;},{passive:true});
wrapEl.addEventListener('touchend',e=>{
  if(swY===null||!gameRunning)return;
  const dy=e.changedTouches[0].clientY-swY;
  if(Math.abs(dy)>20){if(dy<0&&carRow>0){carRow--;setCarPos();}else if(dy>0&&carRow<ROWS-1){carRow++;setCarPos();}}
  swY=null;
},{passive:true});

document.getElementById('input-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
