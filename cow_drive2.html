<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
<title>牛さんドライブ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#1a1a2e;
  font-family:'M PLUS Rounded 1c',sans-serif;
  user-select:none;
  touch-action:none;
}

/* ── 縦画面で回転を促す ── */
#rotate-msg{
  display:none;
  position:fixed;inset:0;
  background:#1a1a2e;
  color:#fff;
  flex-direction:column;
  align-items:center;justify-content:center;
  font-size:18px;font-weight:700;
  z-index:999;
  text-align:center;
  gap:16px;
}
#rotate-msg .icon{font-size:60px;animation:rotateHint 1.5s ease-in-out infinite;}
@keyframes rotateHint{
  0%,100%{transform:rotate(0deg);}
  50%{transform:rotate(90deg);}
}
@media (orientation:portrait){
  #rotate-msg{display:flex;}
  #app{display:none;}
}

/* ── メインアプリ（横画面専用） ── */
#app{
  position:fixed;inset:0;
  overflow:hidden;
}

/* ── 空 ── */
#sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#5BC8F5 0%,#A8E4F8 60%,#C8F4A0 100%);
}
.cloud{
  position:absolute;
  background:rgba(255,255,255,0.9);
  border-radius:40px;
  animation:cloudMove linear infinite;
}
@keyframes cloudMove{
  from{left:105%;}
  to{left:-200px;}
}

/* ── 山 ── */
#mountains{
  position:absolute;
  bottom:30%;left:0;right:0;
  height:100px;overflow:hidden;
}
.mtn{
  position:absolute;bottom:0;
  width:0;height:0;
  border-left:solid transparent;
  border-right:solid transparent;
  border-bottom:solid;
}

/* ── 地面・道路 ── */
#ground{
  position:absolute;
  bottom:0;left:0;right:0;
  height:30%;
}
#grass-strip{
  position:absolute;top:0;left:0;right:0;height:14px;
  background:#4CAF50;
}
#road-body{
  position:absolute;top:14px;left:0;right:0;bottom:0;
  background:#5D6470;
}
#road-lines{
  position:absolute;top:14px;left:0;right:0;
  height:100%;
  background:repeating-linear-gradient(90deg,
    #FFD600 0px,#FFD600 50px,
    transparent 50px,transparent 110px
  );
  animation:linesMove .45s linear infinite;
  opacity:0.7;
}
@keyframes linesMove{
  from{background-position:0 0;}
  to{background-position:-160px 0;}
}
#road-curb{
  position:absolute;top:14px;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg,
    #eee 0,#eee 22px,#E53935 22px,#E53935 44px
  );
}
.tree{
  position:absolute;
  font-size:32px;
  bottom:calc(30% + 10px);
  animation:treeMove linear infinite;
  z-index:3;
}
@keyframes treeMove{
  from{left:105%;}
  to{left:-60px;}
}

/* ── HUD（左上：スコア＋ライフ） ── */
#hud{
  position:absolute;top:6px;left:10px;
  display:flex;align-items:center;gap:14px;
  z-index:80;pointer-events:none;
}
#logo{
  font-family:'Nunito',sans-serif;
  font-size:14px;font-weight:900;color:#fff;
  background:rgba(0,0,0,0.25);
  border-radius:16px;padding:3px 10px;
  text-shadow:1px 1px 0 rgba(0,80,0,0.5);
}
#score-box{
  background:rgba(0,0,0,0.25);
  border-radius:16px;padding:3px 12px;
  text-align:center;
}
#score-label{font-size:8px;color:rgba(255,255,255,0.75);font-weight:700;letter-spacing:1px;}
#score-v{font-size:20px;font-weight:900;color:#fff;line-height:1.1;}
#lives{display:flex;gap:2px;align-items:center;}
.life{font-size:18px;transition:opacity .2s;}
.life.lost{opacity:.15;filter:grayscale(1);}

/* ── コンボ表示 ── */
#combo-display{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-size:17px;font-weight:900;
  color:#FFD600;text-shadow:2px 2px 0 rgba(0,0,0,0.4);
  z-index:80;opacity:0;transition:opacity .2s;
  white-space:nowrap;pointer-events:none;
}
#combo-display.show{opacity:1;}

/* ── 牛の車 ── */
#car{
  position:absolute;
  left:80px;
  width:110px;
  height:auto;
  z-index:30;
  transition:top .1s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(3px 4px 6px rgba(0,0,0,0.35));
  transform:translateY(-50%);
}

/* ── 食材・障害物 ── */
.item{
  position:absolute;
  font-size:36px;
  line-height:1;
  z-index:25;
  pointer-events:none;
}

/* ── コントロール（左右に分離） ── */
.ctrl-btn{
  position:absolute;
  width:72px;height:72px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.28);
  backdrop-filter:blur(4px);
  font-size:26px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
  transition:transform .08s,background .08s;
  z-index:80;
  bottom:18px;
}
.ctrl-btn:active,.ctrl-btn.pressing{
  transform:scale(0.87);
  background:rgba(255,255,255,0.55);
}
#btn-up{left:18px;}
#btn-down{right:18px;}

/* ── フラッシュ ── */
#flash{
  position:absolute;inset:0;
  background:rgba(255,40,40,0.4);
  pointer-events:none;opacity:0;z-index:90;
  transition:opacity .07s;
}
#flash.show{opacity:1;}

/* ── ポップ ── */
.pop{
  position:absolute;font-weight:900;font-size:20px;
  pointer-events:none;z-index:99;
  animation:popUp .75s ease-out forwards;
  text-shadow:1px 1px 0 rgba(0,0,0,0.35);
  white-space:nowrap;
}
@keyframes popUp{
  0%{opacity:1;transform:translateY(0) scale(1);}
  45%{transform:translateY(-26px) scale(1.2);}
  100%{opacity:0;transform:translateY(-56px) scale(0.8);}
}

/* ── オーバーレイ ── */
#overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.8);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
}
.ov-box{
  background:linear-gradient(160deg,#FFFDE7,#FFF8E1);
  border:4px solid #F9A825;
  border-radius:22px;
  padding:20px 28px;
  width:min(480px,88vw);
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.45);
}
/* 横画面のオーバーレイは横並びに */
.ov-inner{
  display:flex;
  align-items:center;
  gap:24px;
}
.ov-left{flex:1;}
.ov-right{flex:1;text-align:left;}
.ov-icon{font-size:48px;margin-bottom:4px;}
@keyframes titleBounce{
  0%,100%{transform:translateY(0) rotate(-3deg);}
  50%{transform:translateY(-10px) rotate(3deg);}
}
.ov-title{
  font-family:'Nunito',sans-serif;
  font-size:22px;font-weight:900;
  color:#E65100;margin-bottom:6px;
}
.ov-body{font-size:12px;color:#795548;line-height:1.9;margin-bottom:10px;}
.ov-score{font-size:42px;font-weight:900;color:#333;margin-bottom:2px;}
.ov-hi{font-size:11px;color:#A0826D;margin-bottom:14px;}
.ov-btn{
  width:100%;
  background:#F9A825;border:none;border-radius:12px;
  padding:12px;
  font-family:'Nunito',sans-serif;
  font-size:18px;font-weight:900;color:#fff;
  cursor:pointer;
  box-shadow:0 4px 0 #E65100;
  transition:transform .1s,box-shadow .1s;
}
.ov-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E65100;}
</style>
</head>
<body>

<!-- 縦画面メッセージ -->
<div id="rotate-msg">
  <div class="icon">📱</div>
  <div>スマホを横向きにしてね！</div>
</div>

<div id="app">
  <div id="sky"></div>
  <div id="mountains"></div>
  <div id="ground">
    <div id="grass-strip"></div>
    <div id="road-curb"></div>
    <div id="road-body"></div>
    <div id="road-lines"></div>
  </div>

  <div id="hud">
    <div id="logo">🏎️ 牛さんドライブ</div>
    <div id="score-box">
      <div id="score-label">スコア</div>
      <div id="score-v">0</div>
    </div>
    <div id="lives">
      <span class="life" id="l0">❤️</span>
      <span class="life" id="l1">❤️</span>
      <span class="life" id="l2">❤️</span>
    </div>
  </div>

  <div id="combo-display"></div>
  <img id="car" src="/mnt/user-data/uploads/1E30B303-0597-4699-8C73-4262000707E0.png" alt="牛さん">
  <div id="flash"></div>

  <button class="ctrl-btn" id="btn-up">⬆️</button>
  <button class="ctrl-btn" id="btn-down">⬇️</button>

  <div id="overlay">
    <div class="ov-box">
      <div class="ov-inner">
        <div class="ov-left">
          <img src="/mnt/user-data/uploads/1E30B303-0597-4699-8C73-4262000707E0.png"
               style="width:140px;height:auto;
                      filter:drop-shadow(4px 6px 8px rgba(0,0,0,0.35));
                      animation:titleBounce 1.8s ease-in-out infinite;">
          <div class="ov-title" style="margin-top:6px;">牛さんドライブ</div>
          <div id="ov-score-area" style="display:none">
            <div class="ov-score" id="ov-score">0</div>
            <div class="ov-hi" id="ov-hi"></div>
          </div>
          <button class="ov-btn" onclick="startGame()">スタート！</button>
        </div>
        <div class="ov-right ov-body">
          🥩🍗🌭<br>
          <span style="color:#C0392B;font-weight:900">お肉 → 高得点！</span><br><br>
          🥦🥕🌽🐟🦑🦐<br>
          <span style="color:#2E7D4F;font-weight:900">野菜・魚介 → 低得点</span><br><br>
          🚧🪨🚜🐕<br>
          <span style="color:#E65100;font-weight:900">障害物 → 減点＆ライフ減！</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const ROWS=3;
const ITEMS=[
  {emoji:'🥩',type:'meat',pts:80},
  {emoji:'🍗',type:'meat',pts:70},
  {emoji:'🌭',type:'meat',pts:60},
  {emoji:'🥦',type:'food',pts:15},
  {emoji:'🥕',type:'food',pts:10},
  {emoji:'🌽',type:'food',pts:12},
  {emoji:'🐟',type:'food',pts:10},
  {emoji:'🦑',type:'food',pts:8},
  {emoji:'🦐',type:'food',pts:8},
  {emoji:'🚧',type:'bad',pts:-30},
  {emoji:'🪨',type:'bad',pts:-30},
  {emoji:'🛢️',type:'bad',pts:-25},
  {emoji:'⚠️',type:'bad',pts:-20},
  {emoji:'🐕',type:'bad',pts:-25},
  {emoji:'🚜',type:'bad',pts:-40},
];

let score=0,lives=3,combo=0,gameRunning=false;
let carRow=1;
let items=[];
let spawnTimer=0,spawnInterval=1200;
let lastTime=null,animFrame=null;
let hiScore=parseInt(localStorage.getItem('cowdrive3_hi')||'0');
let pressUp=false,pressDown=false,moveTimer=0;
const MOVE_DELAY=150;

const appEl=document.getElementById('app');
const carEl=document.getElementById('car');
const flashEl=document.getElementById('flash');
const comboEl=document.getElementById('combo-display');

// ── レーンのY座標（道路内） ──
function getRowY(row){
  const h=appEl.clientHeight;
  const groundTop=h*0.70;
  const roadH=h*0.30;
  const grassH=14;
  const usableH=roadH-grassH;
  const laneH=usableH/ROWS;
  return groundTop+grassH+laneH*row+laneH/2-26;
}

function setCarPos(){
  carEl.style.top=getRowY(carRow)+'px';
}

// ── 背景 ──
function buildBg(){
  // 山
  const mtn=document.getElementById('mountains');
  mtn.innerHTML='';
  [{l:'2%',w:180,h:90,c:'#8FBC8F'},{l:'18%',w:220,h:110,c:'#7AAD7A'},
   {l:'40%',w:160,h:80,c:'#9BCB9B'},{l:'60%',w:200,h:100,c:'#82B882'},{l:'80%',w:150,h:75,c:'#A0C8A0'}
  ].forEach(p=>{
    const d=document.createElement('div');
    d.className='mtn';
    d.style.left=p.l;
    d.style.borderLeftWidth=p.w/2+'px';
    d.style.borderRightWidth=p.w/2+'px';
    d.style.borderBottomWidth=p.h+'px';
    d.style.borderBottomColor=p.c;
    mtn.appendChild(d);
  });

  // 雲
  document.querySelectorAll('.cloud').forEach(c=>c.remove());
  [{w:100,h:32,top:'6%',dur:20,delay:-5},
   {w:150,h:42,top:'15%',dur:28,delay:-12},
   {w:75,h:26,top:'4%',dur:16,delay:-2}
  ].forEach(c=>{
    const el=document.createElement('div');
    el.className='cloud';
    el.style.cssText=`width:${c.w}px;height:${c.h}px;top:${c.top};animation-duration:${c.dur}s;animation-delay:${c.delay}s`;
    appEl.appendChild(el);
  });

  // 木
  document.querySelectorAll('.tree').forEach(t=>t.remove());
  ['🌳','🌲','🌴','🌳','🌲'].forEach((emoji,i)=>{
    const t=document.createElement('div');
    t.className='tree';
    t.textContent=emoji;
    const dur=7+Math.random()*5;
    t.style.cssText=`animation-duration:${dur}s;animation-delay:${-dur*Math.random()}s`;
    appEl.appendChild(t);
  });
}

// ── スタート ──
function startGame(){
  score=0;lives=3;combo=0;carRow=1;
  items.forEach(i=>i.el&&i.el.remove());
  items=[];spawnTimer=0;spawnInterval=1200;
  lastTime=null;moveTimer=0;gameRunning=true;
  document.getElementById('overlay').style.display='none';
  updateHUD();buildBg();setCarPos();
  cancelAnimationFrame(animFrame);
  animFrame=requestAnimationFrame(loop);
}

// ── ループ ──
function loop(ts){
  if(!gameRunning)return;
  if(!lastTime)lastTime=ts;
  const dt=Math.min(ts-lastTime,50);
  lastTime=ts;

  moveTimer+=dt;
  if(moveTimer>=MOVE_DELAY){
    moveTimer=0;
    if(pressUp&&carRow>0){carRow--;setCarPos();}
    else if(pressDown&&carRow<2){carRow++;setCarPos();}
  }

  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){
    spawnTimer=0;
    spawnItem();
    spawnInterval=Math.max(500,spawnInterval-9);
  }

  const carX=80+26;
  items.forEach(item=>{
    item.x-=item.speed*dt/1000;
    item.el.style.left=item.x+'px';
    if(!item.hit){
      const iy=getRowY(item.row);
      const cy=getRowY(carRow);
      if(Math.abs(item.x+18-carX)<46&&Math.abs(iy-cy)<26){
        item.hit=true;handleHit(item);
      }
    }
    if(item.x<-80){item.el.remove();item.done=true;}
  });
  items=items.filter(i=>!i.done);
  animFrame=requestAnimationFrame(loop);
}

function spawnItem(){
  const row=Math.floor(Math.random()*ROWS);
  const r=Math.random();
  let pool;
  if(r<0.25)pool=ITEMS.filter(i=>i.type==='meat');
  else if(r<0.60)pool=ITEMS.filter(i=>i.type==='food');
  else pool=ITEMS.filter(i=>i.type==='bad');
  const def=pool[Math.floor(Math.random()*pool.length)];

  const el=document.createElement('div');
  el.className='item';
  el.textContent=def.emoji;
  const x=appEl.clientWidth+10;
  el.style.left=x+'px';
  el.style.top=(getRowY(row)-18)+'px';
  appEl.appendChild(el);

  const speed=230+Math.random()*70+((1200-spawnInterval)*0.22);
  items.push({row,x,speed,el,def,hit:false,done:false});
}

function handleHit(item){
  const px=item.x+18;
  const py=getRowY(item.row)-28;
  if(item.def.type==='meat'){
    combo++;
    const mul=combo>=3?combo:1;
    const pts=item.def.pts*mul;
    score=Math.max(0,score+pts);
    updateHUD();
    showPop('+'+pts+(combo>=3?' ×'+combo+'🔥':''),px,py,'#E74C3C');
    if(combo>=3){
      comboEl.textContent='肉コンボ×'+combo+'🔥';
      comboEl.classList.add('show');
      clearTimeout(window._ct);
      window._ct=setTimeout(()=>comboEl.classList.remove('show'),900);
    }
  } else if(item.def.type==='food'){
    combo=0;comboEl.classList.remove('show');
    score=Math.max(0,score+item.def.pts);
    updateHUD();
    showPop('+'+item.def.pts,px,py,'#4CAF50');
  } else {
    combo=0;comboEl.classList.remove('show');
    score=Math.max(0,score+item.def.pts);
    lives=Math.max(0,lives-1);
    updateHUD();
    showPop('💥'+item.def.pts,px,py,'#E74C3C');
    doFlash();
    if(lives<=0){item.el.remove();item.done=true;setTimeout(endGame,300);return;}
  }
  item.el.remove();item.done=true;
}

function doFlash(){
  flashEl.classList.add('show');
  setTimeout(()=>flashEl.classList.remove('show'),130);
}

function showPop(text,x,y,color){
  const p=document.createElement('div');
  p.className='pop';p.textContent=text;
  p.style.color=color;p.style.left=x+'px';p.style.top=y+'px';
  appEl.appendChild(p);
  setTimeout(()=>p.remove(),750);
}

function updateHUD(){
  document.getElementById('score-v').textContent=score;
  for(let i=0;i<3;i++) document.getElementById('l'+i).classList.toggle('lost',i>=lives);
}

function endGame(){
  gameRunning=false;
  cancelAnimationFrame(animFrame);
  if(score>hiScore){hiScore=score;localStorage.setItem('cowdrive3_hi',hiScore);}
  const box=document.querySelector('.ov-box');
  box.innerHTML=`
    <div class="ov-inner">
      <div class="ov-left">
        <div class="ov-icon">🐄💨</div>
        <div class="ov-title">ゲームオーバー！</div>
        <div class="ov-score">${score}</div>
        <div class="ov-hi">ハイスコア: ${hiScore}</div>
        <button class="ov-btn" onclick="startGame()">もう一度！</button>
      </div>
      <div class="ov-right ov-body">
        🥩🍗🌭<br>
        <span style="color:#C0392B;font-weight:900">お肉 → 高得点！</span><br><br>
        🥦🥕🌽🐟🦑🦐<br>
        <span style="color:#2E7D4F;font-weight:900">野菜・魚介 → 低得点</span><br><br>
        🚧🪨🚜🐕<br>
        <span style="color:#E65100;font-weight:900">障害物 → 減点＆ライフ減！</span>
      </div>
    </div>
  `;
  document.getElementById('overlay').style.display='flex';
}

// ── ボタン ──
function setupBtn(id,isUp){
  const btn=document.getElementById(id);
  const go=()=>{if(isUp){if(gameRunning&&carRow>0){carRow--;setCarPos();}}else{if(gameRunning&&carRow<2){carRow++;setCarPos();}}};
  const down=e=>{e.preventDefault();btn.classList.add('pressing');if(isUp)pressUp=true;else pressDown=true;go();};
  const up=e=>{e.preventDefault();btn.classList.remove('pressing');if(isUp)pressUp=false;else pressDown=false;};
  btn.addEventListener('touchstart',down,{passive:false});
  btn.addEventListener('touchend',up,{passive:false});
  btn.addEventListener('mousedown',down);
  btn.addEventListener('mouseup',up);
}
setupBtn('btn-up',true);
setupBtn('btn-down',false);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){pressUp=true;if(gameRunning&&carRow>0){carRow--;setCarPos();}}
  if(e.key==='ArrowDown'){pressDown=true;if(gameRunning&&carRow<2){carRow++;setCarPos();}}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')pressUp=false;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')pressDown=false;
});

// スワイプ
let swY=null;
appEl.addEventListener('touchstart',e=>{
  if(e.target.id==='btn-up'||e.target.id==='btn-down')return;
  swY=e.touches[0].clientY;
},{passive:true});
appEl.addEventListener('touchend',e=>{
  if(swY===null||!gameRunning)return;
  const dy=e.changedTouches[0].clientY-swY;
  if(Math.abs(dy)>22){
    if(dy<0&&carRow>0){carRow--;setCarPos();}
    else if(dy>0&&carRow<2){carRow++;setCarPos();}
  }
  swY=null;
},{passive:true});

window.addEventListener('resize',()=>{
  setCarPos();
  items.forEach(i=>i.el.style.top=(getRowY(i.row)-18)+'px');
});
</script>
</body>
</html>
